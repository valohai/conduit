[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/valohai/conduit"
homepage = "https://github.com/valohai/conduit"
authors = ["Valohai"]
keywords = ["llm", "proxy", "openai", "anthropic", "valohai"]

[workspace.metadata.release]
shared-version = true
pre-release-commit-message = "Become {{version}}"
tag-name = "v{{version}}"
tag-message = "Version {{version}}"

[workspace.dependencies]
anyhow = "1"
async-stream = "0.3"
axum = "0.8"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
chrono-humanize = "0.2"
clap = { version = "4.5", features = ["derive"] }
crossterm = { version = "0.29", default-features = false, features = ["events", "windows"] }
futures-util = "0.3"
http-body-util = "0.1"
ratatui = { version = "0.30", default-features = false, features = ["crossterm", "layout-cache"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync"] }
tokio-stream = "0.1"
toml = "1"
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.22", features = ["v7"] }
valohai-conduit-core = { version = "0.1.0", path = "crates/core" }
valohai-conduit-proxy = { version = "0.1.0", path = "crates/proxy" }
valohai-conduit-storage = { version = "0.1.0", path = "crates/storage" }
valohai-conduit-tui = { version = "0.1.0", path = "crates/tui" }

[workspace.lints.clippy]
all = { level = "deny" }

[workspace.lints.rust]
warnings = { level = "deny" }

[profile.dist]
inherits = "release"
lto = "thin"
