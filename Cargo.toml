[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
conduit-proxy = { version = "0.1.0", path = "crates/proxy" }
conduit-core = { version = "0.1.0", path = "crates/core" }
