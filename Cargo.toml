[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
conduit-core = { version = "0.1.0", path = "crates/core" }
conduit-proxy = { version = "0.1.0", path = "crates/proxy" }
serde = { version = "1", features = ["derive"] }
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[workspace.lints.clippy]
all = { level = "deny" }

[workspace.lints.rust]
warnings = { level = "deny" }
