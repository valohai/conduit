# Conduit configuration file that you can copy, edit, and
# rename as `conduit.toml` for development.

listen = "127.0.0.1:8080"

# Each provider gets a proxy route prefix by the provider map key like "openai".
# The proxy strips the prefix before forwarding.
# SDK base_url to configure becomes: http://localhost:8080/{provider}/v1

[providers.openai]
upstream = "https://api.openai.com"

[providers.anthropic]
upstream = "https://api.anthropic.com"

# Great for development!
[providers.bin]
upstream = "https://httpbin.org/"

# Prices for models the built-in table doesn't know, or your own rates, in USD per
# million tokens. A key matches every model name it starts with (the longest key wins)
# and is checked before the built-in table.
# [pricing."jev-"]
# input = 0.042
# output = 0.0

# uncomment and fill for https://llm.valohai.com/ integration:
# [valohai-llm]
# api_key = ""  # or via "VALOHAI_LLM_API_KEY" env var
